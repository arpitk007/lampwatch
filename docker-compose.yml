# Local development services. The app itself runs with ./mvnw spring-boot:run.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: uptime
      MYSQL_USER: uptime
      MYSQL_PASSWORD: uptime
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuptime", "-puptime"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Catches outgoing alert emails locally; read them at http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  mysql-data:
