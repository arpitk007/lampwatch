<a class="skip" href="#main">Skip to content</a>
@if (showShell()) {
  <div class="shell">
    <aside class="rail-col"><div class="rail">
      <a class="brand" routerLink="/" aria-label="Lampwatch, your monitors"><app-logo /></a>
      <nav class="nav" aria-label="Main">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" /></svg>
          Monitors
        </a>
        <a routerLink="/alerts" routerLinkActive="active">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a5 5 0 0 0-5 5v3l-1.5 3h13L15 11V8a5 5 0 0 0-5-5zM8 16.5a2 2 0 0 0 4 0" /></svg>
          Alerts
        </a>
        <a routerLink="/status-page" routerLinkActive="active">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" /><path d="M3 10h14M10 3c2 2.2 2.8 4.6 2.8 7s-.8 4.8-2.8 7c-2-2.2-2.8-4.6-2.8-7S8 5.2 10 3z" /></svg>
          Status page
        </a>
      </nav>
      @if (auth.user(); as user) {
        <div class="account">
          <span class="avatar" aria-hidden="true">{{ user.email[0] }}</span>
          <span class="email" [title]="user.email"><span>{{ emailParts(user.email).local }}</span><span class="domain">{{ emailParts(user.email).domain }}</span></span>
          <button class="signout" type="button" (click)="signOut()">Sign out</button>
        </div>
      }
    </div></aside>
    <main id="main" class="content">
      <router-outlet />
    </main>
  </div>
} @else if (isHome()) {
  <router-outlet />
} @else {
  <main id="main">
    <router-outlet />
  </main>
}
<app-confirm-dialog />
