spring.application.name=uptime-monitor
server.port=${SERVER_PORT:8090}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/uptime}
spring.datasource.username=${DB_USER:uptime}
spring.datasource.password=${DB_PASSWORD:uptime}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6381}

management.endpoints.web.exposure.include=health

# Sessions live in Redis so any app instance can serve any user.
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Alerts. Locally, email goes to Mailpit (docker compose); set real SMTP settings in production.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1026}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
uptime.alerts.mail-from=${ALERTS_FROM:alerts@uptime.local}
uptime.alerts.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
uptime.alerts.app-url=${APP_URL:http://localhost:4300}
spring.data.redis.repositories.enabled=false
